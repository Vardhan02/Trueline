<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trueline: finance morning brief</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <div class="bar">
        <button class="logo" id="b-home" data-go="account" aria-label="Trueline: your account, files and connections">True<span>line</span></button>
        <nav><button data-view="overview">Overview</button><button data-view="priorities">Priorities</button><button data-view="account">Account</button></nav>
        <div class="hbtns">
          <button class="hbtn ic" id="b-zoom" aria-label="Display and accessibility options" aria-haspopup="dialog" aria-expanded="false">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="8.5" cy="8.5" r="5.5" />
              <path d="m13 13 5 5M6 8.5h5M8.5 6v5" />
            </svg></button
          ><button class="hbtn ic" id="b-theme" aria-label="Switch to dark mode">
            <svg class="moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M16.5 11.5A7 7 0 0 1 8.5 3.5a7 7 0 1 0 8 8Z" /></svg
            ><svg class="sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="10" cy="10" r="3.5" />
              <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4" />
            </svg></button
          ><button class="hbtn" id="b-prep">Prepared<span class="ct" id="prepct" hidden>0</span></button><button class="hbtn" id="b-email">Email preview</button
          ><button class="hbtn" id="b-how">How we check</button>
        </div>
        <div class="sync" id="sync"></div>
        <div class="pop" id="pop" role="dialog" aria-label="Display options" hidden>
          <h4>Text size</h4>
          <div class="seg" role="group" aria-label="Text size">
            <button data-zoom="1" aria-pressed="true">100%</button><button data-zoom="1.25" aria-pressed="false">125%</button
            ><button data-zoom="1.5" aria-pressed="false">150%</button>
          </div>
          <label class="tg"><input type="checkbox" id="t-contrast" /> High contrast</label>
          <label class="tg"><input type="checkbox" id="t-motion" /> Reduce motion</label>
          <button class="link" id="t-reset" style="margin-top: 8px">Reset display</button>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <div class="scrim" id="scrim"></div>
    <aside id="drawer" role="dialog" aria-modal="true" aria-label="Details"></aside>
    <script src="/engine.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
