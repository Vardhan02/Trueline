name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t trueline:ci .
      - name: Boot and probe
        run: |
          docker run -d --name tl -p 3000:3000 -e PUBLIC_URL=https://ci.example -e SESSION_SECRET=$(openssl rand -hex 32) -e ENCRYPTION_KEY=$(openssl rand -hex 32) trueline:ci
          for i in $(seq 1 20); do curl -fs localhost:3000/readyz && exit 0; sleep 1; done
          docker logs tl; exit 1
