services:
  - type: web
    name: trueline
    runtime: docker
    plan: starter
    healthCheckPath: /readyz
    disk:
      name: trueline-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: PUBLIC_URL
        sync: false # e.g. https://trueline.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ALLOW_SIGNUP
        value: 'true'
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
